<!DOCTYPE html>
<html>
<head>
    <title>Register Student</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>👨‍🎓 Register Student</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:25px;">
Add a new student to the internship management system.
</p>

<form action="/save_student" method="POST">

<input
type="text"
name="name"
placeholder="👤 Student Name"
required>

<input
type="email"
name="email"
placeholder="📧 Email Address"
required>

<input
type="text"
name="department"
placeholder="🏫 Department"
required>

<button type="submit">
✅ Register Student
</button>

</form>

</div>

</body>
</html>
