<!DOCTYPE html>
<html>

<head>

<title>Student Ranking</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🏆 Student Ranking</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:25px;">
Students ranked according to Attendance and Rating.
</p>

<table>

<tr>

<th>Rank</th>
<th>Name</th>
<th>Department</th>
<th>Attendance</th>
<th>Rating</th>
<th>Score</th>

</tr>

{% for s in students %}

<tr>

<td>
🥇 {{ loop.index }}
</td>

<td>{{ s[1] }}</td>

<td>{{ s[3] }}</td>

<td>{{ s[4] }}%</td>

<td>⭐ {{ s[6] }}</td>

<td>

<b>{{ s[4] + (s[6]*10) }}</b>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
