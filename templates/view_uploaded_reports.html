<!DOCTYPE html>
<html>

<head>

<title>Uploaded Reports</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>📂 Uploaded Reports</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:25px;">
All internship reports submitted by students.
</p>

<table>

<tr>

<th>📄 Report Name</th>

<th>⬇ Action</th>

</tr>

{% for file in files %}

<tr>

<td>

{{ file }}

</td>

<td>

<a href="/download_report/{{ file }}" target="_blank">

<button style="width:auto;padding:10px 18px;">

📥 Open

</button>

</a>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/mentor_dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</body>

</html>
