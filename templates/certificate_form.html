<!DOCTYPE html>
<html>

<head>

<title>Generate Certificate</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>📜 Generate Internship Certificate</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:25px;">
Select a student to generate the internship completion certificate.
</p>

<form action="/generate_certificate" method="POST">

<label style="color:white;font-size:18px;">
👨‍🎓 Select Student
</label>

<select
name="student_name"
required>

{% for student in students %}

<option value="{{ student[1] }}">
{{ student[1] }}
</option>

{% endfor %}

</select>

<button type="submit">

🏅 Generate Certificate

</button>

</form>

<br>

<a href="/mentor_dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</body>

</html>
