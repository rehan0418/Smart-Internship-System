<!DOCTYPE html>
<html>

<head>

<title>Selfie Attendance</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>📷 Selfie Attendance</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:20px;">
Capture a live selfie to mark attendance.
</p>

<video
id="video"
width="420"
height="320"
autoplay
style="border-radius:15px;border:3px solid white;">
</video>

<br><br>

<button
type="button"
onclick="capturePhoto()">

📸 Capture Photo

</button>

<canvas
id="canvas"
width="420"
height="320"
style="display:none;">
</canvas>

<form method="POST">

<input
type="text"
name="student_name"
placeholder="👨‍🎓 Student Name"
required>

<input
type="hidden"
id="photo"
name="photo">

<button type="submit">

✅ Mark Attendance

</button>

</form>

</div>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true})

.then(function(stream){

video.srcObject=stream;

});

function capturePhoto(){

const canvas=document.getElementById("canvas");

const context=canvas.getContext("2d");

context.drawImage(video,0,0,420,320);

document.getElementById("photo").value=
canvas.toDataURL("image/png");

alert("📷 Photo Captured Successfully");

}

</script>

</body>

</html>
