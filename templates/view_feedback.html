<!DOCTYPE html>
<html>

<head>

<title>Student Feedback</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>💬 Student Feedback</h1>
<hr style="margin:20px 0;border:1px solid rgba(255,255,255,0.2);">

<p style="text-align:center;color:white;margin-bottom:25px;">
View all feedback shared by mentors.
</p>

<table>

<tr>

<th>👨‍🎓 Student</th>

<th>💬 Feedback</th>

</tr>

{% for f in feedbacks %}

<tr>

<td>

<b>{{ f[1] }}</b>

</td>

<td style="text-align:left;">

{{ f[2] }}

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/student_dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</body>

</html>
